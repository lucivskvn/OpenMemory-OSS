name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desloppify:
    name: Desloppify Code Quality Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: '1.2.14'

      - name: Run Desloppify Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx desloppify scan . --profile ci

  snyk:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Provision language engines so Snyk can parse multi-manifest trees concurrently
      - name: Set up Python for Snyk Runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Bun for Snyk Runtime
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: '1.2.14'

      - name: Pre-resolve Dependencies
        run: |
          cd packages/openmemory-py
          pip install -e .[dev]
          cd ../..
          cd dashboard
          bun install
          cd ..
          cd packages/openmemory-js
          bun install
          cd ../..

      - name: Initialize Snyk Engine
        uses: snyk/actions/setup@8e119fbb6c251787721d34ba683ed48eba792766 # master

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Run Snyk Monorepo Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects

  semgrep:
    name: Semgrep Application Audit (OSS Free Tier)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.168.0@sha256:b62712449660309316a195e11d7f297a0554f42e0d16f9e0f801010101010101
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Semgrep OSS Scan
        run: semgrep ci --config=p/default --config=p/security-audit --config=p/secrets --config=p/ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  test-python:
    name: Test Python SDK
    needs: [desloppify, snyk, semgrep]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          cd packages/openmemory-py
          pip install -e .[dev]
          pip install pytest pytest-asyncio python-dotenv pyyaml
          
      - name: Run Omnibus Test (Deep Verify)
        run: |
          cd packages/openmemory-py
          python -m pytest tests/test_omnibus.py -v
          
  test-node:
    name: Test Bun SDK Stack
    needs: [desloppify, snyk, semgrep]
    runs-on: ubuntu-latest
    env:
      OM_TURSO_URL: "file:openmemory.db"
      OM_TIER: "fast"
      OM_VEC_DIM: "1536"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: '1.2.14'

      - name: Install Project Workspace Dependencies
        run: |
          cd packages/openmemory-js
          bun install
          
      - name: Run Full Core Test Suite
        run: |
          cd packages/openmemory-js
          bun test
