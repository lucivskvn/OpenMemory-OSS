name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desloppify:
    name: Desloppify Code Quality Baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install Dashboard Lint Dependencies
        run: |
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts --no-progress --network-concurrency=8 --concurrent-scripts=2

      - name: Install PowerShell Analysis Sensor
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Enforce Desloppify Baseline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          dashboard/node_modules/.bin/desloppify scan --path . --profile full --by-language --no-badge
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then exit "$scan_status"; fi

          report=".desloppify/reports/latest.findings.json"
          test -s "$report"
          node - "$report" <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(report.findings) || !report.summary) process.exit(2);
          if ((report.summary.critical ?? 0) > 0) process.exit(1);
          if ((report.summary.high ?? Number.POSITIVE_INFINITY) > 462) process.exit(1);
          if (report.findings.length > 708) process.exit(1);
          NODE

      - name: Upload Desloppify Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desloppify-report
          path: .desloppify/reports/


  snyk:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize Snyk Engine
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Run Snyk Monorepo Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is required; refusing to report an unscanned dependency tree as passing."
            exit 1
          fi
          snyk test --all-projects

  semgrep:
    name: Semgrep Application Audit (OSS Free Tier)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    container:
      image: semgrep/semgrep:1.168.0@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep OSS Scan
        run: semgrep ci --config=p/default --config=p/security-audit --config=p/secrets --config=p/ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  test-python:
    name: Test Python SDK
    runs-on: ubuntu-latest
    env:
      PIP_NO_CACHE_DIR: "1"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v10.0.1
        with:
          version: '0.11.28'
          
      - name: Install Dependencies
        run: |
          cd packages/openmemory-py
          uv sync --locked --group dev --no-install-project --no-build --no-progress

      - name: Run Python Runtime-Safety Lint Gate
        run: |
          cd packages/openmemory-py
          PYTHONPATH=src .venv/bin/ruff check --select=E9,F63,F7,F82 src tests

      - name: Run High-Severity Python Security Gate
        run: |
          cd packages/openmemory-py
          PYTHONPATH=src .venv/bin/bandit -q -r src -lll

      - name: Enforce Python Lint Baseline
        run: |
          cd packages/openmemory-py
          set +e
          PYTHONPATH=src .venv/bin/ruff check --output-format=json src tests > ruff-report.json
          ruff_status=$?
          set -e
          if [ "$ruff_status" -gt 1 ]; then exit "$ruff_status"; fi
          finding_count="$(.venv/bin/python -c 'import json; print(len(json.load(open("ruff-report.json", encoding="utf-8"))))')"
          test "$finding_count" -le 1016

      - name: Enforce Python Security Baseline
        run: |
          cd packages/openmemory-py
          set +e
          PYTHONPATH=src .venv/bin/bandit -q -r src -f json -o bandit-report.json
          bandit_status=$?
          set -e
          if [ "$bandit_status" -gt 1 ]; then exit "$bandit_status"; fi
          finding_count="$(.venv/bin/python -c 'import json; print(len(json.load(open("bandit-report.json", encoding="utf-8"))["results"]))')"
          test "$finding_count" -le 29

      - name: Upload Python QA Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-qa-reports
          path: |
            packages/openmemory-py/ruff-report.json
            packages/openmemory-py/bandit-report.json
          if-no-files-found: warn
          
      - name: Run Omnibus Test (Deep Verify)
        run: |
          cd packages/openmemory-py
          PYTHONPATH=src .venv/bin/pytest tests/ -v
          
  test-node:
    name: Test Bun SDK Stack
    runs-on: ubuntu-latest
    env:
      OM_TURSO_URL: "file:openmemory.db"
      OM_TIER: "fast"
      OM_VEC_DIM: "1536"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install Project Workspace Dependencies
        run: |
          cd packages/openmemory-js
          bun install --frozen-lockfile --ignore-scripts --no-progress --network-concurrency=8 --concurrent-scripts=2

      - name: Run TypeScript Typecheck
        continue-on-error: true
        run: |
          cd packages/openmemory-js
          timeout --kill-after=10s 2m node --max-old-space-size=4096 ./node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
          
      - name: Run Full Core Test Suite
        run: |
          cd packages/openmemory-js
          bun test --max-concurrency=4

  dashboard-qa:
    name: Dashboard Lint Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts --no-progress --network-concurrency=8 --concurrent-scripts=2

      - name: Enforce Dashboard Lint Baseline
        run: |
          cd dashboard
          set +e
          node_modules/.bin/eslint . --format json --output-file eslint-report.json
          eslint_status=$?
          set -e
          if [ "$eslint_status" -gt 1 ]; then exit "$eslint_status"; fi
          finding_count="$(node -e 'const report = require("./eslint-report.json"); console.log(report.reduce((total, file) => total + file.errorCount + file.warningCount, 0));')"
          test "$finding_count" -le 100

      - name: Upload Dashboard Lint Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-eslint-report
          path: dashboard/eslint-report.json
          if-no-files-found: warn
