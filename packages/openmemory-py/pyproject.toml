[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmemory-py"
version = "1.3.2"
description = "OpenMemory Python SDK"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "numpy",
    "httpx",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "notion-client>=2.0",
    "msal>=1.0",
    "PyGithub>=2.0",
    "beautifulsoup4>=4.0",
    "pypdf>=4.0",
    "mammoth>=1.6",
    "markdownify>=0.11",
    "openai>=1.0",
    "tiktoken>=0.7.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp"
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
    "pyyaml",
    "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openmemory"]
