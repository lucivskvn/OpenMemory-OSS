name: publish sdks
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'packages/openmemory-js/**'
      - 'packages/openmemory-py/**'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      js_changed: ${{ steps.filter.outputs.js }}
      py_changed: ${{ steps.filter.outputs.py }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            js:
              - 'packages/openmemory-js/**'
            py:
              - 'packages/openmemory-py/**'

  publish-js:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.js_changed == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: '1.2.14'

      - name: get version
        id: version
        run: |
          cd packages/openmemory-js
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing openmemory-js@$VERSION"

      - name: check registry
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "openmemory-js@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::openmemory-js@${VERSION} is already on npm; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set; cannot publish openmemory-js@${VERSION}."
            exit 1
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: install deps
        if: steps.check.outputs.skip != 'true'
        run: cd packages/openmemory-js && npm ci

      - name: build
        if: steps.check.outputs.skip != 'true'
        run: cd packages/openmemory-js && npm run build

      - name: publish
        if: steps.check.outputs.skip != 'true'
        run: cd packages/openmemory-js && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: notify
        run: |
          echo "✅ Published openmemory-js@${{ steps.version.outputs.version }}"

  publish-py:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.py_changed == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: get version
        id: version
        run: |
          cd packages/openmemory-py
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing openmemory-py@$VERSION"

      - name: check registry
        id: check
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if curl -fsS -o /dev/null "https://pypi.org/pypi/openmemory-py/${VERSION}/json"; then
            echo "::notice::openmemory-py@${VERSION} is already on PyPI; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${PYPI_TOKEN}" ]; then
            echo "::error::PYPI_TOKEN secret is not set; cannot publish openmemory-py@${VERSION}."
            exit 1
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: install build tools
        if: steps.check.outputs.skip != 'true'
        run: pip install build twine

      - name: build
        if: steps.check.outputs.skip != 'true'
        run: cd packages/openmemory-py && python -m build

      - name: publish
        if: steps.check.outputs.skip != 'true'
        run: cd packages/openmemory-py && python -m twine upload dist/* --skip-existing
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: notify
        run: |
          echo "✅ Published openmemory-py@${{ steps.version.outputs.version }}"
