name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:

jobs:
  test-python:
    name: Test Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          cd packages/openmemory-py
          pip install -e .[dev]
          pip install pytest
          pip install pytest-asyncio
          pip install python-dotenv
          pip install pyyaml
          
      - name: Run Omnibus Test (Deep Verify)
        run: |
          cd packages/openmemory-py
          python -m pytest tests/test_omnibus.py -v
          
  test-node:
    name: Test Bun SDK Stack
    runs-on: ubuntu-latest
    env:
      OM_TURSO_URL: "file:openmemory.db"
      OM_TIER: "fast"
      OM_VEC_DIM: "1536"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: '1.2.14'

      - name: Install Project Workspace Dependencies
        run: |
          cd packages/openmemory-js
          bun install
          
      - name: Run Full Core Test Suite
        run: |
          cd packages/openmemory-js
          bun test
