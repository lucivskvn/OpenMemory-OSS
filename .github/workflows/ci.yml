name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:

jobs:
  desloppify:
    name: Desloppify Code Quality Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: '1.2.14'

      - name: Run Desloppify Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx desloppify scan --profile ci

  snyk:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@8e119fbb6c251787721d34ba683ed48eba792766 # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  semgrep:
    name: Semgrep Application Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Semgrep with OWASP Top 10 rules
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/owasp-top-10

  test-python:
    name: Test Python SDK
    needs: [desloppify, snyk, semgrep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          cd packages/openmemory-py
          pip install -e .[dev]
          pip install pytest
          pip install pytest-asyncio
          pip install python-dotenv
          pip install pyyaml
          
      - name: Run Omnibus Test (Deep Verify)
        run: |
          cd packages/openmemory-py
          python -m pytest tests/test_omnibus.py -v
          
  test-node:
    name: Test Bun SDK Stack
    needs: [desloppify, snyk, semgrep]
    runs-on: ubuntu-latest
    env:
      OM_TURSO_URL: "file:openmemory.db"
      OM_TIER: "fast"
      OM_VEC_DIM: "1536"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: '1.2.14'

      - name: Install Project Workspace Dependencies
        run: |
          cd packages/openmemory-js
          bun install
          
      - name: Run Full Core Test Suite
        run: |
          cd packages/openmemory-js
          bun test
