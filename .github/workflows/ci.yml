name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:

jobs:
  test-python:
    name: Test Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          cd packages/openmemory-py
          pip install -e .[dev]
          pip install pytest
          pip install pytest-asyncio
          pip install python-dotenv
          pip install pyyaml
          
      - name: Run Omnibus Test (Deep Verify)
        run: |
          cd packages/openmemory-py
          python -m pytest tests/test_omnibus.py -v
          
  test-node:
    name: Test Bun SDK Stack
    runs-on: ubuntu-latest
    env:
      OM_TURSO_URL: "file:openmemory.db"
      OM_TIER: "fast"
      OM_VEC_DIM: "1536"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install Project Workspace Dependencies
        run: |
          cd packages/openmemory-js
          bun install
          
      - name: Run Full Core Test Suite
        run: |
          cd packages/openmemory-js
          bun test
