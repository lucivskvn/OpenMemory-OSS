name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desloppify:
    name: Desloppify Code Quality Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: '1.2.14'

      - name: Install Dashboard Lint Dependencies
        run: |
          cd dashboard
          bun install --frozen-lockfile --no-progress --network-concurrency=8 --concurrent-scripts=2

      - name: Install PowerShell Analysis Sensor
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run Desloppify Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PATH="$GITHUB_WORKSPACE/dashboard/node_modules/.bin:$PATH" bunx desloppify scan --path . --profile full --by-language --no-badge

      - name: Upload Desloppify Report
        uses: actions/upload-artifact@v4
        with:
          name: desloppify-report
          path: .desloppify/reports/


  snyk:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Provision language engines so Snyk can parse multi-manifest trees concurrently
      - name: Set up Python for Snyk Runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Set up Bun for Snyk Runtime
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: '1.2.14'

      - name: Pre-resolve Dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          cd packages/openmemory-py
          pip install --no-cache-dir -e .[dev]
          cd ../..
          cd dashboard
          bun install --frozen-lockfile --no-progress --network-concurrency=8 --concurrent-scripts=2
          cd ..
          cd packages/openmemory-js
          bun install --frozen-lockfile --no-progress --network-concurrency=8 --concurrent-scripts=2
          cd ../..

      - name: Initialize Snyk Engine
        uses: snyk/actions/setup@8e119fbb6c251787721d34ba683ed48eba792766 # master

      - name: Run Snyk Monorepo Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN is not set. Skipping Snyk scan."
            # We skip gracefully to avoid pipeline failures
          else
            snyk test --all-projects
          fi

  semgrep:
    name: Semgrep Application Audit (OSS Free Tier)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.168.0@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run Semgrep OSS Scan
        run: semgrep ci --config=p/default --config=p/security-audit --config=p/secrets --config=p/ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  test-python:
    name: Test Python SDK
    needs: [desloppify, snyk, semgrep]
    runs-on: ubuntu-latest
    env:
      PIP_NO_CACHE_DIR: "1"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          cd packages/openmemory-py
          pip install --no-cache-dir -e .[dev]
          pip install --no-cache-dir pytest pytest-asyncio python-dotenv pyyaml ruff bandit

      - name: Run Python Runtime-Safety Lint Gate
        run: |
          cd packages/openmemory-py
          ruff check --select=E9,F63,F7,F82 src tests

      - name: Run High-Severity Python Security Gate
        run: |
          cd packages/openmemory-py
          bandit -q -r src -lll

      - name: Publish Python Lint Baseline
        continue-on-error: true
        run: |
          cd packages/openmemory-py
          ruff check src tests

      - name: Publish Python Security Baseline
        continue-on-error: true
        run: |
          cd packages/openmemory-py
          bandit -q -r src
          
      - name: Run Omnibus Test (Deep Verify)
        run: |
          cd packages/openmemory-py
          python -m pytest tests/ -v
          
  test-node:
    name: Test Bun SDK Stack
    needs: [desloppify, snyk, semgrep]
    runs-on: ubuntu-latest
    env:
      OM_TURSO_URL: "file:openmemory.db"
      OM_TIER: "fast"
      OM_VEC_DIM: "1536"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: '1.2.14'

      - name: Install Project Workspace Dependencies
        run: |
          cd packages/openmemory-js
          bun install --frozen-lockfile --no-progress --network-concurrency=8 --concurrent-scripts=2

      - name: Run TypeScript Typecheck
        run: |
          cd packages/openmemory-js
          bun run typecheck
          
      - name: Run Full Core Test Suite
        run: |
          cd packages/openmemory-js
          bun test --max-concurrency=4

  dashboard-qa:
    name: Dashboard Lint Baseline
    needs: [desloppify, snyk, semgrep]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: '1.2.14'

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          bun install --frozen-lockfile --no-progress --network-concurrency=8 --concurrent-scripts=2

      - name: Run Dashboard Lint
        run: |
          cd dashboard
          bun run lint
