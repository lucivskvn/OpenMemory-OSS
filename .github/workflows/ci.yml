name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desloppify:
    name: Desloppify Code Quality Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: '1.2.14'

      - name: Install Dashboard Lint Dependencies
        run: |
          cd dashboard
          bun install --frozen-lockfile --no-progress --network-concurrency=8 --concurrent-scripts=2

      - name: Install PowerShell Analysis Sensor
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run Desloppify Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PATH="$GITHUB_WORKSPACE/dashboard/node_modules/.bin:$PATH" bunx desloppify scan --path . --profile full --by-language --no-badge

      - name: Upload Desloppify Report
        uses: actions/upload-artifact@v4
        with:
          name: desloppify-report
          path: .desloppify/reports/


  snyk:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Provision language engines so Snyk can parse multi-manifest trees concurrently
      - name: Set up Python for Snyk Runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Set up Bun for Snyk Runtime
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: '1.2.14'

      - name: Pre-resolve Dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          cd packages/openmemory-py
          pip install --no-cache-dir -e .[dev]
          cd ../..
          cd dashboard
          bun install --frozen-lockfile --no-progress --network-concurrency=8 --concurrent-scripts=2
          cd ..
          cd packages/openmemory-js
          bun install --frozen-lockfile --no-progress --network-concurrency=8 --concurrent-scripts=2
          cd ../..

      - name: Initialize Snyk Engine
        uses: snyk/actions/setup@8e119fbb6c251787721d34ba683ed48eba792766 # master

      - name: Run Snyk Monorepo Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is required; refusing to report an unscanned dependency tree as passing."
            exit 1
          fi
          snyk test --all-projects

  semgrep:
    name: Semgrep Application Audit (OSS Free Tier)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    container:
      image: semgrep/semgrep:1.168.0@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run Semgrep OSS Scan
        run: semgrep ci --config=p/default --config=p/security-audit --config=p/secrets --config=p/ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  test-python:
    name: Test Python SDK
    needs: [desloppify, snyk, semgrep]
    runs-on: ubuntu-latest
    env:
      PIP_NO_CACHE_DIR: "1"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          cd packages/openmemory-py
          pip install --no-cache-dir -e .[dev]
          pip install --no-cache-dir pytest pytest-asyncio python-dotenv pyyaml ruff==0.16.2 bandit==1.9.4

      - name: Run Python Runtime-Safety Lint Gate
        run: |
          cd packages/openmemory-py
          ruff check --select=E9,F63,F7,F82 src tests

      - name: Run High-Severity Python Security Gate
        run: |
          cd packages/openmemory-py
          bandit -q -r src -lll

      - name: Enforce Python Lint Baseline
        run: |
          cd packages/openmemory-py
          set +e
          ruff check --output-format=json src tests > ruff-report.json
          ruff_status=$?
          set -e
          if [ "$ruff_status" -gt 1 ]; then exit "$ruff_status"; fi
          finding_count="$(python -c 'import json; print(len(json.load(open("ruff-report.json", encoding="utf-8"))))')"
          test "$finding_count" -le 1016

      - name: Enforce Python Security Baseline
        run: |
          cd packages/openmemory-py
          set +e
          bandit -q -r src -f json -o bandit-report.json
          bandit_status=$?
          set -e
          if [ "$bandit_status" -gt 1 ]; then exit "$bandit_status"; fi
          finding_count="$(python -c 'import json; print(len(json.load(open("bandit-report.json", encoding="utf-8"))["results"]))')"
          test "$finding_count" -le 29

      - name: Upload Python QA Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-qa-reports
          path: |
            packages/openmemory-py/ruff-report.json
            packages/openmemory-py/bandit-report.json
          if-no-files-found: warn
          
      - name: Run Omnibus Test (Deep Verify)
        run: |
          cd packages/openmemory-py
          python -m pytest tests/ -v
          
  test-node:
    name: Test Bun SDK Stack
    needs: [desloppify, snyk, semgrep]
    runs-on: ubuntu-latest
    env:
      OM_TURSO_URL: "file:openmemory.db"
      OM_TIER: "fast"
      OM_VEC_DIM: "1536"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: '1.2.14'

      - name: Install Project Workspace Dependencies
        run: |
          cd packages/openmemory-js
          bun install --frozen-lockfile --no-progress --network-concurrency=8 --concurrent-scripts=2

      - name: Run TypeScript Typecheck
        run: |
          cd packages/openmemory-js
          timeout 10m env NODE_OPTIONS=--max-old-space-size=4096 bun run typecheck
          
      - name: Run Full Core Test Suite
        run: |
          cd packages/openmemory-js
          bun test --max-concurrency=4

  dashboard-qa:
    name: Dashboard Lint Ratchet
    needs: [desloppify, snyk, semgrep]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: '1.2.14'

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          bun install --frozen-lockfile --no-progress --network-concurrency=8 --concurrent-scripts=2

      - name: Enforce Dashboard Lint Baseline
        run: |
          cd dashboard
          set +e
          bunx eslint . --format json --output-file eslint-report.json
          eslint_status=$?
          set -e
          if [ "$eslint_status" -gt 1 ]; then exit "$eslint_status"; fi
          finding_count="$(node -e 'const report = require("./eslint-report.json"); console.log(report.reduce((total, file) => total + file.errorCount + file.warningCount, 0));')"
          test "$finding_count" -le 100

      - name: Upload Dashboard Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-eslint-report
          path: dashboard/eslint-report.json
          if-no-files-found: warn
